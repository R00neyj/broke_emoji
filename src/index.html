<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>거지티콘</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="title">이모티콘</div>
    <div class="actions">
      <button id="btn-add" class="icon" title="이미지 추가">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="btn-pin" class="icon" title="항상 위에 고정">
        <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 4H6l4-4zM12 14v6"/></svg>
      </button>
      <button id="btn-settings" class="icon" title="설정">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      </button>
    </div>
  </header>

  <nav id="packs" class="packs"></nav>

  <main id="grid" class="grid"></main>

  <div id="toast" class="toast" hidden></div>
  <div id="selectbar" class="selectbar" hidden>
    <span id="sel-count"></span>
    <button id="sel-all" type="button">전체</button>
    <button id="sel-move" type="button">이동</button>
    <button id="sel-delete" type="button" class="danger">삭제</button>
    <button id="sel-done" type="button" class="primary">완료</button>
  </div>

  <section id="settings" class="settings" hidden>
    <h2>설정</h2>
    <label class="row">
      <span>테마</span>
      <select id="set-theme">
        <option value="system">시스템 설정 따르기</option>
        <option value="light">라이트</option>
        <option value="dark">다크</option>
      </select>
    </label>
    <label class="row">
      <span>카톡 배경색</span>
      <span class="field">
        <input id="set-bg" type="color">
        <input id="set-bg-hex" type="text" maxlength="7" spellcheck="false">
        <button id="btn-eyedropper" type="button" title="화면에서 색 찍기">스포이드</button>
      </span>
    </label>
    <div id="bg-presets" class="presets" aria-label="카톡 배경색 프리셋"></div>
    <p class="hint">카톡 채팅방 배경색과 같게 맞추면 이모티콘처럼 보여요. 사진 배경이면 스포이드로 찍으세요.</p>
    <label class="row"><span>출력 크기(px)</span><input id="set-size" type="number" min="32" max="1024" step="1"></label>
    <label class="row"><span>여백(%)</span><input id="set-pad" type="number" min="0" max="40" step="1"></label>
    <label class="row">
      <span>이미지 맞춤</span>
      <select id="set-fit">
        <option value="contain">전체 보이기 (여백 채움)</option>
        <option value="cover">정사각형으로 자르기</option>
      </select>
    </label>
    <label class="row"><span>추가할 때 배경 제거</span><input id="set-remove" type="checkbox"></label>
    <label class="row"><span>배경 제거 허용 오차</span><input id="set-tol" type="number" min="0" max="128" step="1"></label>
    <label class="row col">
      <span>갤러리 폴더</span>
      <span class="field">
        <input id="set-dir" type="text" spellcheck="false">
        <button id="btn-dir-apply" type="button">적용</button>
        <button id="btn-dir-open" type="button">열기</button>
      </span>
    </label>
  </section>

  <section id="cropper" class="cropper" hidden>
    <div id="crop-stage" class="crop-stage">
      <img id="crop-img" alt="">
      <div id="crop-box" class="crop-box"><div class="crop-handle"></div></div>
    </div>
    <div class="crop-bar">
      <label><input id="crop-square" type="checkbox" checked> 정사각형</label>
      <span class="spacer"></span>
      <button id="crop-cancel" type="button">취소</button>
      <button id="crop-new" type="button">새로 저장</button>
      <button id="crop-overwrite" type="button" class="primary">덮어쓰기</button>
    </div>
  </section>

  <div id="menu" class="menu" hidden></div>
  <div id="drop" class="drop" hidden>여기에 놓으면 추가돼요</div>
  <input id="file" type="file" accept="image/*" multiple hidden>

  <script src="imaging.js"></script>
  <script src="main.js"></script>
</body>
</html>
