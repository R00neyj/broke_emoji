name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run build

      # Copy before the installer build, which patches bundle info into the exe.
      - name: Rename exe (ASCII asset name)
        shell: pwsh
        run: Copy-Item "src-tauri/target/release/거지티콘.exe" "broke_emoji-${{ github.ref_name }}.exe"

      # NSIS tools are downloaded from GitHub releases, which occasionally answer 504.
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-nsis-3.13

      # github.com download URLs of the NSIS toolset answer 504 for long stretches while the API
      # download works. Lay out the toolset where the Tauri bundler looks so it skips its own
      # downloads (a lone DLL is not enough: it recreates the folder when files are missing).
      - name: Pre-fetch NSIS toolset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools = "$env:LOCALAPPDATA\tauri"
          if (-not (Test-Path "$tools\NSIS\makensis.exe")) {
            New-Item -ItemType Directory -Force $tools | Out-Null
            gh release download nsis-3.13 -R tauri-apps/binary-releases -p nsis-3.13.zip -D $tools --clobber
            Expand-Archive "$tools\nsis-3.13.zip" -DestinationPath $tools -Force
            if (Test-Path "$tools\NSIS") { Remove-Item "$tools\NSIS" -Recurse -Force }
            Rename-Item "$tools\nsis-3.13" "NSIS"
          }
          $dir = "$tools\NSIS\Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download nsis_tauri_utils-v0.5.3 -R tauri-apps/nsis-tauri-utils -p nsis_tauri_utils.dll -D $dir --clobber

      - name: Build installer (retry on download errors)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            npm run build:installer
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep 60
          }
          exit $LASTEXITCODE

      - name: Rename setup (ASCII asset name)
        shell: pwsh
        run: Copy-Item (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName "broke_emoji-${{ github.ref_name }}-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: broke_emoji
          path: broke_emoji-*.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: broke_emoji-*.exe
          generate_release_notes: true
