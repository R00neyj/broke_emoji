name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run build

      # Copy before the installer build, which patches bundle info into the exe.
      - name: Rename exe (ASCII asset name)
        shell: pwsh
        run: Copy-Item "src-tauri/target/release/거지티콘.exe" "broke_emoji-${{ github.ref_name }}.exe"

      # NSIS tools are downloaded from GitHub releases, which occasionally answer 504.
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-nsis-3.13

      - name: Build installer (retry on download errors)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm run build:installer
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep 20
          }
          exit $LASTEXITCODE

      - name: Rename setup (ASCII asset name)
        shell: pwsh
        run: Copy-Item (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName "broke_emoji-${{ github.ref_name }}-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: broke_emoji
          path: broke_emoji-*.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: broke_emoji-*.exe
          generate_release_notes: true
